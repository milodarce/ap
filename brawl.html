<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comic Brawl: 2-Player Versus</title>
    <style>
        /* 
         * GLOBAL STYLES & COMIC BOOK AESTHETIC
         */
        @import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Crucial for multi-touch gaming */
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            font-family: 'Bangers', cursive, sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffe300; /* Comic yellow background */
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 
         * UI SCREENS
         */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(255, 227, 0, 0.95);
            z-index: 10;
            transition: opacity 0.3s;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 8vw;
            color: #ff2a2a;
            text-shadow: 4px 4px 0 #000, 8px 8px 0 #fff;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            -webkit-text-stroke: 3px black;
        }

        h2 {
            font-size: 4vw;
            color: #fff;
            text-shadow: 3px 3px 0 #000;
            margin-bottom: 20px;
            -webkit-text-stroke: 2px black;
        }

        .char-select-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .char-box {
            width: 120px;
            height: 120px;
            border: 6px solid #000;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 6px 6px 0 #000;
            transition: transform 0.1s;
        }

        .char-box:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0 #000;
        }

        .btn {
            background-color: #00d2ff;
            color: #fff;
            font-family: inherit;
            font-size: 2rem;
            padding: 10px 30px;
            border: 5px solid #000;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 6px 6px 0 #000;
            text-transform: uppercase;
        }

        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0 #000;
        }

        /* 
         * IN-GAME HUD 
         */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            padding: 20px;
            display: flex;
            justify-content: space-between;
        }

        .health-container {
            width: 40%;
            height: 40px;
            background: #fff;
            border: 5px solid #000;
            box-shadow: 4px 4px 0 #000;
            position: relative;
        }

        .health-bar {
            height: 100%;
            background: #00ff00;
            width: 100%;
            transition: width 0.2s ease-out, background-color 0.2s;
        }

        .health-bar.low {
            background: #ff2a2a;
        }

        .player-label {
            position: absolute;
            top: 45px;
            font-size: 1.5rem;
            color: #fff;
            -webkit-text-stroke: 1px black;
            text-shadow: 2px 2px 0 #000;
        }

        #p1-label { left: 0; }
        #p2-label { right: 0; }
        #p2-health { transform: scaleX(-1); /* Flips P2 health to drain towards center */ }

        /* 
         * TOUCH CONTROLS (Displayed based on touch support)
         */
        #touch-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            padding: 10px;
        }

        .touch-group {
            width: 45%;
            height: 100%;
            display: flex;
            align-items: flex-end;
            pointer-events: auto;
        }

        .touch-group.left { justify-content: flex-start; }
        .touch-group.right { justify-content: flex-end; }

        .d-pad, .action-pad {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            width: 150px;
            height: 100px;
        }

        .action-pad {
            width: 100px;
            grid-template-columns: repeat(2, 1fr);
        }

        .t-btn {
            background: rgba(255, 255, 255, 0.5);
            border: 4px solid rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: rgba(0, 0, 0, 0.7);
        }

        .t-btn:active {
            background: rgba(255, 255, 255, 0.9);
            border-color: #000;
        }

        /* D-Pad specific placement */
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-atk { grid-column: 1 / span 2; grid-row: 2; border-radius: 10px; background: rgba(255, 42, 42, 0.5); color: white;}
        .btn-atk:active { background: rgba(255, 42, 42, 0.9); }

        /* Hide touch UI on non-touch devices initially */
        @media (pointer: fine) {
            #touch-controls { display: none; }
        }

    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
        <div class="health-container">
            <div id="p1-health" class="health-bar"></div>
            <div id="p1-label" class="player-label">PLAYER 1</div>
        </div>
        <div class="health-container">
            <div id="p2-health" class="health-bar"></div>
            <div id="p2-label" class="player-label">PLAYER 2</div>
        </div>
    </div>

    <!-- TOUCH CONTROLS -->
    <div id="touch-controls" class="hidden">
        <!-- Player 1 Controls -->
        <div class="touch-group left">
            <div class="d-pad">
                <div class="t-btn btn-up" data-player="p1" data-key="up">▲</div>
                <div class="t-btn btn-left" data-player="p1" data-key="left">◀</div>
                <div class="t-btn btn-right" data-player="p1" data-key="right">▶</div>
            </div>
            <div class="action-pad">
                <div class="t-btn btn-atk" data-player="p1" data-key="attack">ATK</div>
            </div>
        </div>
        <!-- Player 2 Controls -->
        <div class="touch-group right">
            <div class="action-pad" style="direction: rtl;">
                <div class="t-btn btn-atk" data-player="p2" data-key="attack">ATK</div>
            </div>
            <div class="d-pad">
                <div class="t-btn btn-up" data-player="p2" data-key="up">▲</div>
                <div class="t-btn btn-left" data-player="p2" data-key="left">◀</div>
                <div class="t-btn btn-right" data-player="p2" data-key="right">▶</div>
            </div>
        </div>
    </div>

    <!-- SCREENS -->
    <div id="screen-select" class="screen">
        <h1>Select Character</h1>
        <h2 id="select-status">PLAYER 1: CHOOSE!</h2>
        <div class="char-select-container">
            <div class="char-box" style="background-color: #ff2a2a;" onclick="selectCharacter('#ff2a2a')"></div>
            <div class="char-box" style="background-color: #00d2ff;" onclick="selectCharacter('#00d2ff')"></div>
            <div class="char-box" style="background-color: #ffcc00;" onclick="selectCharacter('#ffcc00')"></div>
        </div>
        <p style="margin-top: 20px; font-family: sans-serif; font-size: 14px; text-align: center; max-width: 80%;">
            <strong>PC Controls:</strong><br>
            P1: A/D Move, W Jump, F Attack<br>
            P2: Arrows Move, Up Jump, L Attack<br>
            <strong>Mobile:</strong> Use On-Screen controls.
        </p>
    </div>

    <div id="screen-gameover" class="screen hidden">
        <h1 id="winner-text">PLAYER 1 WINS!</h1>
        <button class="btn" onclick="resetToSelect()">REMATCH</button>
    </div>
</div>

<script>
    /**
     * ==========================================
     * GAME CONFIGURATION & ENGINE SETUP
     * ==========================================
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // WORLD SETTINGS (Expanded Arena)
    const WORLD = { w: 2400, h: 1400 };

    const CONFIG = {
        gravity: 0.7,
        baseSpeed: 9,
        jumpForce: 24,
        attackCooldown: 400, // ms
        attackDuration: 150, // ms
        knockback: { x: 12, y: 7 },
        maxHealth: 100,
        powerUpSpawnRate: 8000 // ms
    };

    // Global State
    let gameState = 'SELECT'; // SELECT, BATTLE, GAMEOVER
    let animationFrameId;
    let lastTime = 0;
    let lastPowerUpTime = 0;

    // Characters chosen
    let p1Color = null;
    let p2Color = null;

    // Camera Object
    const camera = { x: 0, y: 0, scale: 1 };

    /**
     * ==========================================
     * MAP: PLATFORMS & POWER-UPS
     * ==========================================
     */
    const platforms = [
        // Main indestructible floor
        { x: -100, y: WORLD.h - 150, w: WORLD.w + 200, h: 200, type: 'main' },
        
        // Floating platforms (One-way) - Spaced for the new higher jump
        { x: 300, y: WORLD.h - 420, w: 400, h: 40, type: 'oneway' },
        { x: 1700, y: WORLD.h - 420, w: 400, h: 40, type: 'oneway' },
        { x: 1000, y: WORLD.h - 700, w: 400, h: 40, type: 'oneway' },
        { x: 500, y: WORLD.h - 980, w: 300, h: 40, type: 'oneway' },
        { x: 1600, y: WORLD.h - 980, w: 300, h: 40, type: 'oneway' }
    ];

    let powerUps = [];

    function spawnPowerUp() {
        const types = ['HEALTH', 'SPEED'];
        const type = types[Math.floor(Math.random() * types.length)];
        
        // Pick a random platform to spawn above
        const plat = platforms[Math.floor(Math.random() * platforms.length)];
        
        // Don't spawn on the very edges or inside the main floor too often
        const spawnX = plat.x + 50 + Math.random() * (plat.w - 100);
        const spawnY = plat.y - 100;

        powerUps.push({
            x: spawnX,
            y: spawnY,
            w: 50,
            h: 50,
            type: type,
            active: true,
            vy: 0
        });
    }

    /**
     * ==========================================
     * RESIZE LOGIC
     * ==========================================
     */
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    /**
     * ==========================================
     * INPUT HANDLING (KEYBOARD & TOUCH)
     * ==========================================
     */
    const keys = {
        p1: { left: false, right: false, up: false, down: false, attack: false },
        p2: { left: false, right: false, up: false, down: false, attack: false }
    };

    window.addEventListener('keydown', (e) => {
        if(e.code === 'KeyA') keys.p1.left = true;
        if(e.code === 'KeyD') keys.p1.right = true;
        if(e.code === 'KeyW') keys.p1.up = true;
        if(e.code === 'KeyS') keys.p1.down = true;
        if(e.code === 'KeyF') keys.p1.attack = true;

        if(e.code === 'ArrowLeft') keys.p2.left = true;
        if(e.code === 'ArrowRight') keys.p2.right = true;
        if(e.code === 'ArrowUp') keys.p2.up = true;
        if(e.code === 'ArrowDown') keys.p2.down = true;
        if(e.code === 'KeyL') keys.p2.attack = true;
    });

    window.addEventListener('keyup', (e) => {
        if(e.code === 'KeyA') keys.p1.left = false;
        if(e.code === 'KeyD') keys.p1.right = false;
        if(e.code === 'KeyW') keys.p1.up = false;
        if(e.code === 'KeyS') keys.p1.down = false;
        if(e.code === 'KeyF') keys.p1.attack = false;

        if(e.code === 'ArrowLeft') keys.p2.left = false;
        if(e.code === 'ArrowRight') keys.p2.right = false;
        if(e.code === 'ArrowUp') keys.p2.up = false;
        if(e.code === 'ArrowDown') keys.p2.down = false;
        if(e.code === 'KeyL') keys.p2.attack = false;
    });

    // Touch UI Binding
    const touchBtns = document.querySelectorAll('.t-btn');
    touchBtns.forEach(btn => {
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const p = btn.getAttribute('data-player');
            const k = btn.getAttribute('data-key');
            keys[p][k] = true;
        });
        btn.addEventListener('touchend', (e) => {
            e.preventDefault();
            const p = btn.getAttribute('data-player');
            const k = btn.getAttribute('data-key');
            keys[p][k] = false;
        });
    });

    const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

    /**
     * ==========================================
     * PLAYER CLASS & LOGIC
     * ==========================================
     */
    class Player {
        constructor(x, y, color, direction) {
            this.x = x;
            this.y = y;
            this.width = 70;
            this.height = 130;
            this.vx = 0;
            this.vy = 0;
            
            this.color = color;
            this.health = CONFIG.maxHealth;
            this.direction = direction; // 1 = right, -1 = left
            
            this.isGrounded = false;
            this.isAttacking = false;
            this.lastAttackTime = 0;
            this.isHit = false;
            this.hitTimer = 0;

            // Buffs
            this.speedBuffTimer = 0;
        }

        update(input, opponent, dt) {
            let currentSpeed = CONFIG.baseSpeed;
            
            // Handle Buffs
            if (this.speedBuffTimer > 0) {
                this.speedBuffTimer -= dt;
                currentSpeed *= 1.6; // 60% faster
            }

            // Horizontal Movement
            if (!this.isHit) {
                if (input.left) {
                    this.vx = -currentSpeed;
                } else if (input.right) {
                    this.vx = currentSpeed;
                } else {
                    this.vx = 0;
                }

                // Jump
                if (input.up && this.isGrounded) {
                    this.vy = -CONFIG.jumpForce;
                    this.isGrounded = false;
                }

                // Attack
                if (input.attack && !this.isAttacking && Date.now() - this.lastAttackTime > CONFIG.attackCooldown) {
                    this.isAttacking = true;
                    this.lastAttackTime = Date.now();
                    this.checkHit(opponent);
                }
            }

            // End attack
            if (this.isAttacking && Date.now() - this.lastAttackTime > CONFIG.attackDuration) {
                this.isAttacking = false;
            }

            // Hit stun recovery
            if (this.isHit) {
                this.hitTimer -= dt;
                if (this.hitTimer <= 0) this.isHit = false;
            }

            // Auto-turn to face opponent
            if (!this.isAttacking && !this.isHit) {
                if (opponent.x > this.x) this.direction = 1;
                else this.direction = -1;
            }

            // Apply Gravity
            this.vy += CONFIG.gravity;

            // Remember previous Y for platform collision detection
            let oldY = this.y;

            // Apply Velocity
            this.x += this.vx;
            this.y += this.vy;

            // PLATFORM COLLISIONS
            this.isGrounded = false;
            for (let plat of platforms) {
                // Check X overlap
                if (this.x < plat.x + plat.w && this.x + this.width > plat.x) {
                    // Check if falling down and crossing the top edge
                    if (this.vy > 0 && oldY + this.height <= plat.y + 0.1 && this.y + this.height >= plat.y) {
                        
                        // If holding down, fall through one-way platforms
                        if (plat.type === 'oneway' && input.down) {
                            continue; 
                        }

                        this.y = plat.y - this.height;
                        this.vy = 0;
                        this.isGrounded = true;
                        if (this.isHit) this.vx = 0; // Stop sliding when knocked down
                    }
                }
            }

            // Check PowerUp Collisions
            for (let p of powerUps) {
                if (p.active && 
                    this.x < p.x + p.w && this.x + this.width > p.x &&
                    this.y < p.y + p.h && this.y + this.height > p.y) {
                    
                    p.active = false;
                    this.applyPowerUp(p.type);
                }
            }

            // Map Bounds
            if (this.x < 0) this.x = 0;
            if (this.x + this.width > WORLD.w) this.x = WORLD.w - this.width;
            
            // Death plane (falling off bottom of world somehow)
            if (this.y > WORLD.h) this.takeDamage(100, 0); 
        }

        applyPowerUp(type) {
            if (type === 'HEALTH') {
                this.health += 30;
                if (this.health > CONFIG.maxHealth) this.health = CONFIG.maxHealth;
            } else if (type === 'SPEED') {
                this.speedBuffTimer = 5000; // 5 seconds of speed
            }
        }

        checkHit(opponent) {
            const attackW = 100;
            const attackH = 50;
            const attackX = this.direction === 1 ? this.x + this.width : this.x - attackW;
            const attackY = this.y + 20;

            if (
                attackX < opponent.x + opponent.width &&
                attackX + attackW > opponent.x &&
                attackY < opponent.y + opponent.height &&
                attackY + attackH > opponent.y
            ) {
                opponent.takeDamage(15, this.direction);
            }
        }

        takeDamage(amount, fromDirection) {
            this.health -= amount;
            if (this.health < 0) this.health = 0;
            
            this.isHit = true;
            this.hitTimer = 300; 
            
            // Knockback logic
            this.vx = CONFIG.knockback.x * (fromDirection === 0 ? 1 : fromDirection);
            this.vy = -CONFIG.knockback.y;
            this.isGrounded = false;
            this.isAttacking = false;
        }
    }

    let p1, p2;

    /**
     * ==========================================
     * CAMERA LOGIC
     * ==========================================
     */
    function updateCamera() {
        if (!p1 || !p2) return;

        // Find bounding box encompassing both players
        const pad = 400; // Padding around players
        const minX = Math.min(p1.x, p2.x) - pad;
        const maxX = Math.max(p1.x + p1.width, p2.x + p2.width) + pad;
        const minY = Math.min(p1.y, p2.y) - pad;
        const maxY = Math.max(p1.y + p1.height, p2.y + p2.height) + pad;

        const targetW = maxX - minX;
        const targetH = maxY - minY;

        // Determine target scale to fit them
        let scaleX = canvas.width / targetW;
        let scaleY = canvas.height / targetH;
        let targetScale = Math.min(scaleX, scaleY);
        
        // Restrict how far camera zooms in/out
        targetScale = Math.max(0.4, Math.min(targetScale, 1.1));

        // Center point between players
        const midX = (p1.x + p1.width/2 + p2.x + p2.width/2) / 2;
        const midY = (p1.y + p1.height/2 + p2.y + p2.height/2) / 2;

        let targetX = midX - (canvas.width / 2) / targetScale;
        let targetY = midY - (canvas.height / 2) / targetScale;

        // Clamp Camera to World boundaries
        if (targetX < 0) targetX = 0;
        if (targetY < 0) targetY = 0;
        if (targetX + canvas.width / targetScale > WORLD.w) targetX = WORLD.w - canvas.width / targetScale;
        if (targetY + canvas.height / targetScale > WORLD.h) targetY = WORLD.h - canvas.height / targetScale;

        // Smooth Lerp for camera movement
        camera.x += (targetX - camera.x) * 0.1;
        camera.y += (targetY - camera.y) * 0.1;
        camera.scale += (targetScale - camera.scale) * 0.1;
    }

    /**
     * ==========================================
     * RENDERING FUNCTIONS (MODULAR)
     * ==========================================
     */
    
    function drawBackground() {
        // Comic style background: halftone dots or speed lines are complex, 
        // we'll stick to bold pop-art colors scaling the entire world map
        
        // Sky gradient replacement (solid for comic style)
        ctx.fillStyle = '#ff9900'; 
        ctx.fillRect(0, 0, WORLD.w, WORLD.h);

        // Add some background building silhouettes or static pop-art clouds if desired
        ctx.fillStyle = '#cc7a00';
        for(let i=0; i<WORLD.w; i+=400) {
            ctx.fillRect(i + 50, WORLD.h - 500, 200, 500);
        }
    }

    function drawPlatforms() {
        // ---- CUSTOM SPRITE REPLACEMENT HERE ----
        // To use custom images, loop through and use:
        // ctx.drawImage(imgPlatform, plat.x, plat.y, plat.w, plat.h);

        ctx.save();
        platforms.forEach(plat => {
            if(plat.type === 'main') {
                ctx.fillStyle = '#00a3cc'; // Cyan floor
            } else {
                ctx.fillStyle = '#ff00ff'; // Magenta floating platforms
            }
            
            // Thick comic book stroke
            ctx.lineWidth = 10;
            ctx.strokeStyle = '#000';
            
            ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
            ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);

            // Inner detail line for aesthetic depth
            ctx.beginPath();
            ctx.moveTo(plat.x + 15, plat.y + 20);
            ctx.lineTo(plat.x + plat.w - 15, plat.y + 20);
            ctx.lineWidth = 4;
            ctx.stroke();
        });
        ctx.restore();
    }

    function drawPowerUps() {
        // ---- CUSTOM SPRITE REPLACEMENT HERE ----
        // ctx.drawImage(imgItem, p.x, p.y, p.w, p.h);

        ctx.save();
        powerUps.forEach(p => {
            if (!p.active) return;
            
            // Float animation
            const floatY = p.y + Math.sin(Date.now() / 150) * 8;

            ctx.fillStyle = p.type === 'HEALTH' ? '#00ff00' : '#00ffff';
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#000';
            
            // Draw box
            ctx.fillRect(p.x, floatY, p.w, p.h);
            ctx.strokeRect(p.x, floatY, p.w, p.h);
            
            // Icon
            ctx.fillStyle = '#000';
            ctx.font = '30px Bangers';
            ctx.textAlign = 'center';
            ctx.fillText(p.type === 'HEALTH' ? '♥' : '⚡', p.x + p.w/2, floatY + 35);
        });
        ctx.restore();
    }

    function drawPlayer(player, isP1) {
        // ---- CUSTOM SPRITE REPLACEMENT HERE ----
        // ctx.drawImage(myImage, player.x, player.y, player.width, player.height);

        ctx.save();
        
        // Flash white if hit
        if (player.isHit && Math.floor(Date.now() / 50) % 2 === 0) {
            ctx.fillStyle = '#FFFFFF';
        } else {
            ctx.fillStyle = player.color;
        }

        // Speed buff aura
        if (player.speedBuffTimer > 0) {
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 20;
        }

        // Draw Player Body (Box)
        ctx.lineWidth = 8;
        ctx.strokeStyle = '#000';
        ctx.fillRect(player.x, player.y, player.width, player.height);
        ctx.strokeRect(player.x, player.y, player.width, player.height);

        ctx.shadowBlur = 0; // reset shadow

        // Draw "Face" / Visor to show direction
        ctx.fillStyle = '#fff';
        const eyeW = 35;
        const eyeH = 18;
        const eyeX = player.direction === 1 ? player.x + player.width - eyeW - 5 : player.x + 5;
        const eyeY = player.y + 25;
        
        ctx.fillRect(eyeX, eyeY, eyeW, eyeH);
        ctx.strokeRect(eyeX, eyeY, eyeW, eyeH);

        // Draw Player Label above head
        ctx.fillStyle = '#000';
        ctx.font = '24px Bangers';
        ctx.textAlign = 'center';
        ctx.fillText(isP1 ? "P1" : "P2", player.x + player.width/2, player.y - 15);

        // ---- DRAW ATTACK HITBOX ----
        if (player.isAttacking) {
            const attackW = 100;
            const attackH = 50;
            const attackX = player.direction === 1 ? player.x + player.width : player.x - attackW;
            const attackY = player.y + 20;

            // Comic style "BAM!" flash
            ctx.fillStyle = '#ff2a2a'; // Red attack box
            ctx.fillRect(attackX, attackY, attackW, attackH);
            ctx.strokeRect(attackX, attackY, attackW, attackH);

            ctx.fillStyle = '#fff';
            ctx.font = '30px Bangers';
            ctx.fillText("BAM!", attackX + attackW/2, attackY + 35);
        }

        ctx.restore();
    }

    function updateHealthUI() {
        const h1 = document.getElementById('p1-health');
        const h2 = document.getElementById('p2-health');

        h1.style.width = p1.health + '%';
        h2.style.width = p2.health + '%';

        // Add low health class
        if (p1.health <= 30) h1.classList.add('low'); else h1.classList.remove('low');
        if (p2.health <= 30) h2.classList.add('low'); else h2.classList.remove('low');
    }

    /**
     * ==========================================
     * MAIN GAME LOOP
     * ==========================================
     */
    function update(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = timestamp - lastTime;
        lastTime = timestamp;

        if (gameState === 'BATTLE') {
            
            // Power-up spawning logic
            if (timestamp - lastPowerUpTime > CONFIG.powerUpSpawnRate) {
                spawnPowerUp();
                lastPowerUpTime = timestamp;
            }

            // Power-up gravity & cleanup
            powerUps.forEach(p => {
                if (!p.active) return;
                p.vy += CONFIG.gravity;
                p.y += p.vy;
                
                // Platform collision for powerups
                for (let plat of platforms) {
                    if (p.y + p.h >= plat.y && p.y + p.h <= plat.y + 20 && p.x + p.w > plat.x && p.x < plat.x + plat.w) {
                        p.y = plat.y - p.h;
                        p.vy = 0;
                    }
                }
            });
            // Clean up consumed powerups
            powerUps = powerUps.filter(p => p.active);

            // Player Logic
            p1.update(keys.p1, p2, dt);
            p2.update(keys.p2, p1, dt);
            
            updateCamera();
            updateHealthUI();

            // Win Condition
            if (p1.health <= 0 || p2.health <= 0) {
                endGame(p1.health <= 0 ? "PLAYER 2" : "PLAYER 1");
            }

            // Rendering
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            // Apply Camera Transformations
            ctx.scale(camera.scale, camera.scale);
            ctx.translate(-camera.x, -camera.y);

            drawBackground();
            drawPlatforms();
            drawPowerUps();
            drawPlayer(p1, true);
            drawPlayer(p2, false);
            
            ctx.restore();
        }

        animationFrameId = requestAnimationFrame(update);
    }

    /**
     * ==========================================
     * GAME STATE MANAGEMENT
     * ==========================================
     */
    function selectCharacter(color) {
        if (gameState !== 'SELECT') return;

        if (!p1Color) {
            p1Color = color;
            document.getElementById('select-status').innerText = "PLAYER 2: CHOOSE!";
            document.getElementById('select-status').style.color = p1Color;
        } else if (!p2Color) {
            p2Color = color;
            startBattle();
        }
    }

    function startBattle() {
        gameState = 'BATTLE';
        
        document.getElementById('screen-select').classList.add('hidden');
        document.getElementById('screen-gameover').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        
        if (isTouchDevice) {
            document.getElementById('touch-controls').classList.remove('hidden');
        }

        // Initialize Players at opposite sides of the large arena
        p1 = new Player(400, WORLD.h - 400, p1Color, 1);
        p2 = new Player(WORLD.w - 400, WORLD.h - 400, p2Color, -1);
        
        powerUps = []; // Reset powerups
        lastPowerUpTime = performance.now();

        // Snap camera immediately to players
        updateCamera();
        camera.x += 1000; // force a slight initial jolt to snap them in

        for(let key in keys.p1) keys.p1[key] = false;
        for(let key in keys.p2) keys.p2[key] = false;

        lastTime = 0;
        updateHealthUI();
    }

    function endGame(winnerText) {
        gameState = 'GAMEOVER';
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('touch-controls').classList.add('hidden');
        
        document.getElementById('winner-text').innerText = winnerText + " WINS!";
        document.getElementById('winner-text').style.color = winnerText === "PLAYER 1" ? p1Color : p2Color;
        document.getElementById('screen-gameover').classList.remove('hidden');
    }

    function resetToSelect() {
        p1Color = null;
        p2Color = null;
        gameState = 'SELECT';
        
        document.getElementById('screen-gameover').classList.add('hidden');
        document.getElementById('screen-select').classList.remove('hidden');
        
        document.getElementById('select-status').innerText = "PLAYER 1: CHOOSE!";
        document.getElementById('select-status').style.color = "#fff";
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // Start Engine
    requestAnimationFrame(update);

</script>
</body>
</html>
